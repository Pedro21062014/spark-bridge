[package]
name = "spark-bridge"
version = "0.1.0"
description = "Lightweight PC bridge for AI agents (screen, input, terminal) with free public tunnel"
authors = ["Spark Bridge"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
axum = "0.7"
tower-http = { version = "0.5", features = ["cors"] }
screenshots = "0.8"
image = "0.25"
base64 = "0.22"
enigo = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
rand = "0.8"
regex = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
