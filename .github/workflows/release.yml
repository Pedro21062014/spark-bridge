name: Build & Release Spark Bridge

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: ""
          - platform: ubuntu-24.04
            args: ""
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev \
            libxcb1-dev \
            libxrandr-dev \
            libdbus-1-dev \
            libssl-dev \
            libgtk-3-dev \
            libpipewire-0.3-dev \
            libclang-dev \
            libgbm-dev

      - name: Install npm dependencies & generate icons
        run: |
          npm install
          npx tauri icon src-tauri/icons/icon.png

      - name: Build and Release with Tauri Action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v0.1.1
          releaseName: "Spark Bridge v0.1.1"
          releaseBody: "Download Spark Bridge for Linux (.deb, .AppImage), Windows (.exe), and macOS (.dmg)."
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
