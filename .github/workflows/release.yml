name: Build & Release Spark Bridge

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag para a release (ex: v0.2.0). Deixe vazio para usar a tag/ref selecionada."
        required: false
        type: string

permissions:
  contents: write

jobs:
  publish-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: ""
          - platform: ubuntu-24.04
            args: ""
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev \
            libxcb1-dev \
            libxrandr-dev \
            libdbus-1-dev \
            libssl-dev \
            libgtk-3-dev \
            libpipewire-0.3-dev \
            libclang-dev \
            libgbm-dev

      - name: Install npm dependencies & generate icons
        run: |
          npm install
          npx tauri icon src-tauri/icons/icon.png

      - name: Build and Release with Tauri Action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: "Spark Bridge ${{ inputs.tag || github.ref_name }}"
          releaseBody: |
            ## ⚡ Spark Bridge ${{ inputs.tag || github.ref_name }}

            Ponte PC para agentes de IA com MCP Streamable HTTP (endpoint `/mcp` com SSE),
            túnel público gratuito via Cloudflare e controle de tela, mouse, teclado e terminal.

            ### 📥 Download
            - **Linux:** `.deb` ou `.AppImage`
            - **Windows:** `.exe` (ou `.msi`)
            - **macOS:** `.dmg`

            ### 🚀 Como usar
            1. Abra o Spark Bridge e clique em **Iniciar Conexão**.
            2. Copie a **URL Completa para MCP** (termina em `/mcp?token=...`) ou a configuração do seu cliente.
            3. Cole no cliente MCP (Claude Desktop, Cursor, VS Code, Gemini CLI) e conecte.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
