name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev \
            libxcb1-dev \
            libxrandr-dev \
            libdbus-1-dev \
            libssl-dev \
            libgtk-3-dev \
            libpipewire-0.3-dev \
            libclang-dev \
            libgbm-dev

      - name: Install npm dependencies & generate icons
        run: |
          npm install
          npx tauri icon src-tauri/icons/icon.png

      - name: Check frontend JS syntax
        run: node --check ui/app.js

      - name: Cargo check
        working-directory: src-tauri
        run: cargo check

      - name: Cargo test (MCP smoke test)
        working-directory: src-tauri
        run: cargo test --lib
