<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spark Bridge</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="bg-glow"></div>
  <div class="container">
    <header class="header">
      <div class="brand">
        <div class="logo">⚡</div>
        <div>
          <h1>Spark Bridge</h1>
          <p class="subtitle">Ponte PC para Agentes de IA &amp; MCP</p>
        </div>
      </div>
      <div id="status-badge" class="badge offline">
        <span class="dot"></span>
        <span id="status-text">Desconectado</span>
      </div>
    </header>

    <main class="card main-card">
      <button id="toggle-btn" class="btn-primary">
        <span id="btn-text">Iniciar Conexão</span>
      </button>
      <p id="error-msg" class="error hidden"></p>

      <div class="field-group highlight-group">
        <label>URL Completa para MCP / Agente (Link + Token)</label>
        <div class="copy-row">
          <input id="mcp-url" type="text" readonly placeholder="Clique em Iniciar para gerar o link MCP..." />
          <button class="btn-copy btn-copy-accent" data-target="mcp-url">Copiar</button>
        </div>
      </div>

      <div class="divider"></div>

      <div class="field-group">
        <label>Link Público (Cloudflare Tunnel)</label>
        <div class="copy-row">
          <input id="public-url" type="text" readonly placeholder="Aguardando..." />
          <button class="btn-copy" data-target="public-url">Copiar</button>
        </div>
      </div>

      <div class="field-group">
        <label>Token de Segurança (Bearer)</label>
        <div class="copy-row">
          <input id="api-token" type="text" readonly />
          <button class="btn-copy" data-target="api-token">Copiar</button>
        </div>
      </div>
    </main>

    <section class="card settings">
      <h2>Configurações</h2>
      <label class="toggle-row">
        <div>
          <strong>Executar em segundo plano</strong>
          <small>Minimiza para a bandeja do sistema ao fechar a janela</small>
        </div>
        <input id="bg-toggle" type="checkbox" checked />
      </label>

      <label class="toggle-row">
        <div>
          <strong>Iniciar com o sistema</strong>
          <small>Abre automaticamente quando o PC ligar</small>
        </div>
        <input id="autostart-toggle" type="checkbox" />
      </label>
    </section>

    <section class="card info">
      <h2>Endpoints disponíveis</h2>
      <div class="endpoints-grid">
        <div class="ep"><code>GET /screen</code><span>Ver tela</span></div>
        <div class="ep"><code>POST /mouse/click</code><span>Clicar</span></div>
        <div class="ep"><code>POST /keyboard/type</code><span>Digitar</span></div>
        <div class="ep"><code>POST /terminal/exec</code><span>Terminal</span></div>
      </div>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
